<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="dq-base-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a73e8" />
      <stop offset="100%" stop-color="#1558b0" />
    </linearGradient>
    <linearGradient id="dq-badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34a853" />
      <stop offset="100%" stop-color="#137333" />
    </linearGradient>
    <filter id="dq-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0b2e59" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="32" height="32" rx="7.5" fill="url(#dq-base-grad)" />

  <!-- Data Grid / Sheet Rows -->
  <rect x="5.5" y="6" width="21" height="4.5" rx="1.5" fill="#ffffff" fill-opacity="0.35" />
  <rect x="5.5" y="12" width="13" height="3" rx="1" fill="#ffffff" fill-opacity="0.25" />
  <rect x="5.5" y="16.5" width="10" height="3" rx="1" fill="#ffffff" fill-opacity="0.25" />
  <rect x="5.5" y="21" width="12" height="3" rx="1" fill="#ffffff" fill-opacity="0.25" />

  <!-- Quality Validation Verified Seal -->
  <g filter="url(#dq-glow)">
    <circle cx="21.5" cy="20.5" r="7" fill="url(#dq-badge-grad)" stroke="#ffffff" stroke-width="1.6" />
    <path d="M18.5 20.5l2 2 4-4" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
