services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-data_quality}
      POSTGRES_USER: ${POSTGRES_USER:-data_quality}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-data_quality}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://data_quality:data_quality@db:5432/data_quality}
      STORAGE_ROOT: /data/storage
      MASTER_REFERENCE_PATH: /app/reference/master.csv
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      MAX_DATASET_ROWS: ${MAX_DATASET_ROWS:-100000}
      MAX_DATASET_COLUMNS: ${MAX_DATASET_COLUMNS:-1000}
      MAX_DATASET_CELLS: ${MAX_DATASET_CELLS:-2000000}
      MAX_FINDINGS: ${MAX_FINDINGS:-10000}
      PREVIEW_ROWS: ${PREVIEW_ROWS:-50}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MAX_COLUMNS: ${LLM_MAX_COLUMNS:-20}
      LLM_MAX_CANDIDATES: ${LLM_MAX_CANDIDATES:-50}
      LLM_MAX_ACTION_GROUPS: ${LLM_MAX_ACTION_GROUPS:-20}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-10}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-dq_session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-8}
      AUTH_MAX_FAILED_ATTEMPTS: ${AUTH_MAX_FAILED_ATTEMPTS:-5}
      AUTH_LOCK_MINUTES: ${AUTH_LOCK_MINUTES:-15}
      BACKOFFICE_API_BASE_URL: ${BACKOFFICE_API_BASE_URL:-}
      BACKOFFICE_API_TOKEN: ${BACKOFFICE_API_TOKEN:-}
      BACKOFFICE_PAGE_SIZE: ${BACKOFFICE_PAGE_SIZE:-100}
      BACKOFFICE_TIMEOUT_SECONDS: ${BACKOFFICE_TIMEOUT_SECONDS:-10}
    volumes:
      - ./backend:/app
      - ./backend/reference/master.csv:/app/reference/master.csv:ro
      - ./storage:/data/storage
      - ./samples:/samples:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
